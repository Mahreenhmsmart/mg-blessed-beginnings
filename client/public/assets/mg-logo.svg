<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="letter-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0d4fc"/>
    </linearGradient>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset dx="0" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#c084fc" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" ry="12" fill="url(#badge-bg)"/>

  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="44" height="44" rx="12" ry="12" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="0.75"/>

  <!-- MG Monogram Letters -->
  <g filter="url(#inner-glow)">
    <!-- M letterform — bold, geometric with clean peaks -->
    <path d="M10.5 35V13h4.2l5.3 12.5L25.3 13h4.2v22h-3.8V21.2L20.5 33h-1.6L14.3 21.2V35h-3.8z" fill="url(#letter-sheen)"/>

    <!-- G letterform — elegant open curve with crossbar -->
    <path d="M31.5 28.8c1.2 1.3 2.8 2.2 4.5 2.2 2.8 0 4.2-1.8 4.2-4.5V24h-4.5v-2.8h8.2v5.8c0 4.5-2.8 7.2-7 7.2-2.8 0-4.8-1.2-6.2-3.2-1.4-2-2.1-4.6-2.1-7.5s0.7-5.4 2.1-7.4c1.4-2 3.4-3.1 6-3.1 2.3 0 4.1 0.8 5.4 2.4l-2.3 2.4c-0.8-1.1-1.9-1.7-3.2-1.7-1.7 0-3 0.8-3.9 2.3-0.9 1.5-1.3 3.3-1.3 5.4 0 2.2 0.4 4 1.2 5.5z" fill="url(#letter-sheen)" transform="translate(-3.5, 0) scale(0.88)"/>
  </g>

  <!-- Decorative sparkle accents -->
  <!-- Top-right sparkle (4-point star) -->
  <g opacity="0.8">
    <line x1="38" y1="7" x2="38" y2="13" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="35" y1="10" x2="41" y2="10" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Small dot accent bottom-left -->
  <circle cx="9" cy="39" r="1.3" fill="white" opacity="0.5"/>

  <!-- Tiny diamond accent top-left -->
  <rect x="7.5" y="7.5" width="2.5" height="2.5" rx="0.5" fill="white" opacity="0.35" transform="rotate(45, 8.75, 8.75)"/>

  <!-- Micro sparkle bottom-right -->
  <g opacity="0.45">
    <line x1="40" y1="37" x2="40" y2="41" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="38" y1="39" x2="42" y2="39" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
